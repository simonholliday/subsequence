name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Callable from publish.yml, so a tag proves exactly what a merge proves.
  # Publishing used to run build and twine check and nothing else, so a tag on
  # an untested — or red — commit shipped to PyPI regardless.
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest

    # Both ends of the supported range. pyproject says >=3.10 and the dev
    # machine runs 3.14, so testing one of them tested neither: the cheat-sheet
    # gate and a docstring example both passed on 3.14 and failed on 3.10,
    # and only a runner ever saw it.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']

    name: pytest (${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # python-rtmidi ships no wheel for every interpreter here — 3.14 builds it
      # from source — and that build needs ALSA present or it fails at metadata
      # generation, before a single test has run. Unconditional rather than
      # matched to a version, because which interpreters have a wheel is a fact
      # about somebody else's release schedule.
      - name: Install the ALSA headers python-rtmidi builds against
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dev]"

      - name: Check docstring markup
        run: python scripts/check_docstring_markup.py subsequence

      - name: Check the cheat sheet matches the code
        run: python scripts/generate_cheatsheet.py --check

      # The fourth of the four gates run before every commit here, and the
      # only one CI did not have — so a type error reached main and waited for
      # somebody to run mypy by hand. Same shape as the cheat-sheet check that
      # was CI-only and went red three times (#2593): a gate that does not run
      # where the problem happens is not a gate.
      - name: Type-check
        run: python -m mypy subsequence

      - name: Run tests
        run: python -m pytest tests/ -q
