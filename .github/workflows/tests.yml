name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pytest:
    runs-on: ubuntu-latest

    # Both ends of the supported range. pyproject says >=3.10 and the dev
    # machine runs 3.14, so testing one of them tested neither: the cheat-sheet
    # gate and a docstring example both passed on 3.14 and failed on 3.10,
    # and only a runner ever saw it.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']

    name: pytest (${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # python-rtmidi ships no wheel for every interpreter here — 3.14 builds it
      # from source — and that build needs ALSA present or it fails at metadata
      # generation, before a single test has run. Unconditional rather than
      # matched to a version, because which interpreters have a wheel is a fact
      # about somebody else's release schedule.
      - name: Install the ALSA headers python-rtmidi builds against
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Check docstring markup
        run: python scripts/check_docstring_markup.py subsequence

      - name: Check the cheat sheet matches the code
        run: python scripts/generate_cheatsheet.py --check

      - name: Run tests
        run: python -m pytest tests/ -q
