[pytest]
pythonpath = .
testpaths = tests
markers =
	asyncio: mark a test as using asyncio
asyncio_mode = auto

# Keep the cache off the project tree, for the same reason as mypy's cache_dir
# in pyproject.toml.  This checkout lives on an SMB share, and a full-suite run
# writing .pytest_cache back into it contends with anything else holding the
# tree open — a live composition, an editor's git polling — which has wedged
# pytest in uninterruptible I/O (#612).  Reads are fine; it is the write that
# collides.
#
# It goes here rather than in pyproject.toml because pytest.ini wins outright:
# with both present pytest reports "ignoring pytest config in pyproject.toml".
cache_dir = /tmp/pytest-cache-subsequence
